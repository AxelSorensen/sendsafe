name: Release desktop app

# Push a tag like v0.1.0 (or run manually) to build installers for macOS (Apple silicon + Intel), Windows and Linux.
# Needs the repo secret SENDSAFE_RELAY_URL (the address printed by `pnpm run setup` in relay/).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple silicon
            args: ''
          - os: macos-15-intel      # Intel
            args: ''
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04      # Linux (x64): .deb and AppImage
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.os }}
    env:
      SENDSAFE_RELAY_URL: ${{ secrets.SENDSAFE_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      # Keeps compiled Rust dependencies between releases (the slowest part of a build).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Check relay URL
        shell: bash
        run: test -n "$SENDSAFE_RELAY_URL" || (echo "Secret SENDSAFE_RELAY_URL is not set" && exit 1)
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build web app and stage the bundled Node runtime
        run: node scripts/prepare.mjs
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed apps accept them (key made with `tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'SendSafe ${{ github.ref_name }}'
          releaseDraft: false
          args: ${{ matrix.args }}
      # The upload page links to fixed file names, so add copies without the version number.
      - name: Upload fixed-name installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          OSNAME: ${{ matrix.os }}
        run: |
          mkdir -p fixed
          echo "$PATHS" | tr -d '[]"' | tr ',' '\n' > paths.txt
          while read -r p; do
            if [ "$OSNAME" = macos-14 ] && [[ "$p" == *.dmg ]]; then cp "$p" fixed/SendSafe-mac-arm.dmg; fi
            if [ "$OSNAME" = macos-15-intel ] && [[ "$p" == *.dmg ]]; then cp "$p" fixed/SendSafe-mac-intel.dmg; fi
            if [ "$OSNAME" = ubuntu-22.04 ] && [[ "$p" == *.deb ]]; then cp "$p" fixed/SendSafe-linux.deb; fi
            if [ "$OSNAME" = ubuntu-22.04 ] && [[ "$p" == *.AppImage ]]; then cp "$p" fixed/SendSafe-linux.AppImage; fi
            if [ "$OSNAME" = windows-latest ] && [[ "$p" == *-setup.exe ]]; then cp "$p" fixed/SendSafe-windows.exe; fi
          done < paths.txt
          ls fixed
          gh release upload "${{ github.ref_name }}" fixed/* --clobber
